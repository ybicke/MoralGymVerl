# PD presentation-robustness — Qwen3-8B. Paired rerun of
# pd_presentation_robustness.yaml with the model as the only axis that
# moves (same pairing convention as single_turn_screen_qwen3.yaml vs
# single_turn_screen.yaml); see pd_presentation_robustness.yaml for the
# full rationale, the instrument caveat (behavioral-only: the probes force
# fixed presentation), and the presentation-axis notes.
#
# What it settles for qwen specifically: the screen found prose roughly
# doubles the deon-family conditioning gap on qwen (deon+repair PD Δ_opp
# +61 prose vs +35 matrix) at fixed presentation only — this measures
# whether that conditioning survives surface randomization, and whether
# qwen's clean fixed-presentation defection floor (no own-move artifact,
# unlike gemma) stays clean when labels/layout/order/role are shuffled.
#
# Pool this group with single_turn_screen_qwen3-8b at analysis time
# (publication_tables.py renders Tables 3/3b/4a/4b once these cells
# exist).
#
# Submit:
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/teacher_signal/qwen3_8b/classic/pd_presentation_robustness.yaml --dry-run
#
# 1 game x 2 representations x 2 values x 2 presentation arms = 8 cells.

num_episodes: 400

axes:
  game: [prisoners_dilemma]
  representation: [matrix, prose]
  moral_value: [none, deontological]
  protocol: [single_round]
  presentation: [fixed_representation, surface_randomization]

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"

extra_args: ["--temperature", "0.7"]
