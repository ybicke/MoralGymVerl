# PGG single-turn screen v4 — deontological wording screen on the adopted
# `decision_full` block: does fixing the principle's REFERENT or the label
# MAPPING remove the 22% label inversion the v3 screen measured
# (analysis_pgg_qwen3-8b.md §3: "good faith" resolved by majority)?
#
# Three new arms against the existing v3 baseline (pgg_single_turn_qwen3-8b_v3,
# job 3185343: none 1|1, deontological 62|40 with 22% inversion):
#   deon_fairplay        fair-play wording (Hart/Rawls/Cullity) — referent =
#                        the contribution itself; NO exploit stems, so Table 2
#                        reads it silent and the curve is the evidence
#   deon_explicit        'deontological' with the referent made explicit
#                        ("those who contribute in good faith"); keeps the
#                        exploit stems -> inversion directly comparable
#   deontological+hint   screened wording verbatim + the label-naming rider
#                        ('hint' in moral_values.py) — isolates the mapping
#                        channel; requires labels: fixed (behavioral.py guards)
#
# Read: Table 2 inversion (deon_explicit, deontological+hint vs v3's 22%),
# the k-slope within own_prev, and the (·, k=0) level ("contribute" in the
# text may lift it with no one to protect). Everything else byte-identical
# to the v3 protocol: decision_full, fixed presentation, description off,
# T=0.7, 8 balanced states x 50 eps.
#
# 1 x 1 x 3 x 1 = 3 cells (1 packed node). deontological/none NOT rerun —
# compare against v3 (same config, code drift deemed cosmetic; rerun
# deontological here if a paired same-code baseline turns out to matter).
#
# Submit:
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/teacher_signal/qwen3_8b/pgg/single_turn_v4.yaml --dry-run

num_episodes: 400

axes:
  game: [public_goods]

  representation: [decision_full]

  moral_value:
    - deon_fairplay
    - deon_explicit
    - deontological+hint

  protocol: [single_round]

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7"]
