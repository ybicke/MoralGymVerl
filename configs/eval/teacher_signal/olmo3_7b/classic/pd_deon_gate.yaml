# In-context deon gate, Olmo-3-7B-Instruct, PD. The SDPO teacher is this
# model with the principle in context, so the deon row has to separate from
# the none row here before an Olmo SDPO run is worth submitting. The two
# rows are also the paper's baselines for Olmo: the untrained model, and
# the untrained model with the principle in its prompt.
#
# Reads against the Qwen3-8B screen (teacher_signal/qwen3_8b/classic/
# single_turn_screen, prose rows): same protocol, PD and prose only, probes
# off. With pgg/deon_gate.yaml this is 4 cells, one packed node:
#
#   EVAL_STAGE=pre_eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/teacher_signal/olmo3_7b/classic/pd_deon_gate.yaml \
#       configs/eval/teacher_signal/olmo3_7b/pgg/deon_gate.yaml --dry-run

num_episodes: 400          # 100 per fabricated state

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none, deontological]
  protocol: [single_round]

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"

extra_args: ["--temperature", "0.7"]
