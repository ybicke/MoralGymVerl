# =============================================================================
# PGG single-turn screen — base config (gemma-2-9b-it, untrained).
#
# The commons analog of the single-turn screen (docs/pgg_design.md §9.2):
# binary linear public-goods game, canonical N=4 E=10 s=5 (r=2, MPCR 0.5),
# balanced over the 8 fabricated (own_prev, k_prev) states. Headline is the
# k-slope within own_prev (behavioral.json -> "pgg" block), never pooled
# P(C). Value arms wrap the prompt exactly as in the 2x2 screen.
#
# Presentation FIXED (matches the 2x2 moral screens); surface
# randomization, sampled (E,s) and the compliance/waste regime cells are
# follow-up blocks per §9.2.
#
# Sweep driver: scripts/slurm/submit_sweep.py configs/sweeps/pgg_single_turn.yaml
# =============================================================================

seed: 42

policy:
  model_name: google/gemma-2-9b-it

game:
  type: public_goods
  n_players: 4
  endowment: 10
  share: 5
  # regime: dilemma            # only read when evaluation.payoffs: sample
  num_rounds: 5                # single_round protocol overrides to 1

prompt:
  # Off: the preamble fixes the label anchor but erases the k-slope
  # (docs/pgg_design.md §9.6).
  game_description: false
  game_design: hist            # protocol preset also pins this
  # table | prose | list | decision | decision_full; see
  # pgg_screen_qwen3_8b.yaml for why `list` is the default.
  representation: list         # swept via REPRESENTATION
  reasoning: true              # CoT + "Action: <label>" — screen regime
  minimal_parsing: false
  show_horizon: false

evaluation:
  # 400 = 50 eps per fabricated state (8 states; num_episodes must be
  # divisible by 8), matching pgg_screen_qwen3_8b.yaml so the two models are
  # read at the same resolution. Gemma has no measured PGG budget of its own
  # -- its screen has never run (the 2026-08-21 submission was cancelled) --
  # so this inherits Qwen's, where 400 took ~4 h/cell against the 5 h wall.
  # Its 512-token cap should make it cheaper; confirm on the first cell.
  num_episodes: 400
  # single_round protocol pins opponents: [random] (the per-paradigm
  # stochastic co-player; headline is opponent-independent single-shot).
  opponents: [conditional_contributor]
  temperature: 0.7
  max_new_tokens: 512
  # Presentation FIXED (Tennant-exact labels action3/action4, identity
  # layout/order) to match the 2x2 moral screens' protocol; surface
  # randomization is a follow-up robustness block (docs §9.2), as it was
  # for the 2x2 games. role must stay fixed for public_goods.
  labels: fixed
  label_order: fixed
  layout: fixed
  role: fixed
  payoffs: fixed

# Rewards don't drive anything at eval; kept for metric parity with training.
reward:
  intrinsic: deontological
  lambda: 0.75
  game_reward: normalized

probe_b:
  num_traces: 32

teacher:
  moral_value: none            # swept via --moral-value
  wrap_position: first
  template_source: /users/bickery/MoralGymVerl/configs/verl/sdpo_pd_tft.yaml
  feedback_template: "\nMoral value to follow:\n{feedback_raw}\n"
