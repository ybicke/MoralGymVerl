# Checkpoint eval, gemma2_9b_sdpo_pd_deon-repair-gen_tft_200 — SDPO run 2, gemma-2-9b-it. Steps 60 (emerging), 120 (spec-closest band), 200 (endpoint; DC declines late).
# Single-round none arm, fixed prose presentation: the screen's own
# protocol, so each trained row drops into Table 1 next to the existing
# base-none and base+principle rows of the same model. Behavioral only:
# the none arm never runs probes (signal extractability is the wrong
# question for a trained model); RUN_PROBES=off restates that.
#
# Submit (adapters on iopsstor — the eval container does not mount
# /capstor/store). Results: eval_results/post_training/gemma2_9b_sdpo_pd_deon-repair-gen_tft_200/classic/ckpt_ladder/.
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/post_training/gemma2_9b_sdpo_pd_deon-repair-gen_tft_200/classic/ckpt_ladder.yaml --dry-run
#
# 3 cells, 1 node.

num_episodes: 400          # 100 decisions per fabricated state

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - gemma2_9b_sdpo_pd_deon-repair-gen_tft_200/global_step_60
    - gemma2_9b_sdpo_pd_deon-repair-gen_tft_200/global_step_120
    - gemma2_9b_sdpo_pd_deon-repair-gen_tft_200/global_step_200

env:
  RUN_PROBES: "off"

extra_args: ["--temperature", "0.7"]
