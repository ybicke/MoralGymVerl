# Checkpoint eval, qwen3_8b_sdpo_pd_deon-repair-gen_tft_200 — four steps bracketing the selected
# checkpoint (90 = balanced-profile point of the state-resolved
# trajectory; 60 emerging, 120 past it, 200 the over-cooperation
# endpoint), single-round none arm, fixed prose presentation: the
# screen's own protocol, so each row drops into Table 1 next to the
# existing base-none (12|0|2|4) and base+principle (99|33|94|40) rows.
# Four cells = one packed node (billed the same as one cell).
# No probes (nothing to contrast without teacher text).
#
# Submit (adapters are read from MORALGYM_CKPT_ROOT, which the eval
# container mounts). Results: eval_results/post_training/qwen3_8b_sdpo_pd_deon-repair-gen_tft_200/classic/ckpt_ladder/.
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/post_training/qwen3_8b_sdpo_pd_deon-repair-gen_tft_200/classic/ckpt_ladder.yaml --dry-run
#
# 4 cells, 1 node.

num_episodes: 400          # 100 decisions per fabricated state

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - qwen3_8b_sdpo_pd_deon-repair-gen_tft_200/global_step_60
    - qwen3_8b_sdpo_pd_deon-repair-gen_tft_200/global_step_90
    - qwen3_8b_sdpo_pd_deon-repair-gen_tft_200/global_step_120
    - qwen3_8b_sdpo_pd_deon-repair-gen_tft_200/global_step_200

env:
  RUN_PROBES: "off"

extra_args: ["--temperature", "0.7"]
