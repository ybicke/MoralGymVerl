# Multi-round PGG reference row for Olmo-3: the untrained model with the
# deontological principle in its prompt. Protocol as in
# transfer/qwen3_8b/pgg/multi_round.yaml.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/olmo3_7b/pgg/multi_round_incontext.yaml --dry-run

num_episodes: 20           # per co-player group; x3 x5 rounds = 300 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [deontological]
  protocol: [multi_round]
  checkpoint: [base]

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7"]
