# Multi-round PGG of the Olmo-3 label-sampling ablation at step 200. Protocol
# as in transfer/qwen3_8b/pgg/multi_round.yaml; base and base+ctx rows live in
# multi_round_sdpo_seed1 and multi_round_incontext.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/olmo3_7b/pgg/multi_round_sdpo_randlabels_seed1.yaml --dry-run

num_episodes: 20           # per co-player group; x3 x5 rounds = 300 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - olmo3_7b_sdpo_pd_deon-randlabels_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7"]
