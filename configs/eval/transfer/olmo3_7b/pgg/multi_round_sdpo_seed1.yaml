# Multi-round PGG, Olmo-3: the untrained model and the step-200 checkpoint
# of olmo3_7b_sdpo_pd_deon_tft_200_seed1, no moral text. Protocol as in
# transfer/qwen3_8b/pgg/multi_round.yaml.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/olmo3_7b/pgg/multi_round_sdpo_seed1.yaml --dry-run

num_episodes: 20           # per co-player group; x3 x5 rounds = 300 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - base
    - olmo3_7b_sdpo_pd_deon_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7"]
