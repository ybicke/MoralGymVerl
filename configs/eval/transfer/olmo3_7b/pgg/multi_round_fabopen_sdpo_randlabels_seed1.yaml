# Multi-round PGG opened with a fabricated first round, as in
# multi_round_fabopen, for the Olmo-3 label-sampling run at step 200, with
# and without the principle in context.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/olmo3_7b/pgg/multi_round_fabopen_sdpo_randlabels_seed1.yaml --dry-run

num_episodes: 24           # per co-player group; 3 per fabricated state

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none, deontological]
  protocol: [multi_round]
  checkpoint:
    - olmo3_7b_sdpo_pd_deon-randlabels_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7", "--game-design", "hist"]
