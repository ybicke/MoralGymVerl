# PGG transfer of olmo3_7b_sdpo_pd_deon-randlabels_tft_200_seed1 at step 200:
# the label-sampling ablation (action labels drawn per prompt during
# training), read against single_round_sdpo_seed1 (fixed labels) and the
# reference rows in teacher_signal/olmo3_7b/pgg/deon_gate.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/olmo3_7b/pgg/single_round_sdpo_randlabels_seed1.yaml --dry-run

num_episodes: 400          # 50 per fabricated (own_prev, k) state

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - olmo3_7b_sdpo_pd_deon-randlabels_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7"]
