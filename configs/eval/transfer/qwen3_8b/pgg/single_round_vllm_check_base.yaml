# Check of the batched vLLM eval path, thinking off: the base model with and
# without the principle, against the sequential cells in
# teacher_signal/qwen3_8b/pgg/single_turn_v3 (1% and 51%).
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/single_round_vllm_check_base.yaml --dry-run

num_episodes: 200          # 25 per fabricated (own_prev, k) state

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none, deontological]
  protocol: [single_round]
  checkpoint: [base]

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7", "--backend", "vllm",
             "--max-new-tokens", "30000"]
