# Multi-round PGG opened with a fabricated first round (the training-prompt
# state) instead of an empty history; rounds 2-5 are played live. Tests
# whether the live-play gap comes from the opening state alone. Base and
# SDPO seed 1 at step 200, each with and without the principle in context.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_fabopen.yaml --dry-run

num_episodes: 24           # per co-player group; 3 per fabricated state

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none, deontological]
  protocol: [multi_round]
  checkpoint:
    - base
    - qwen3_8b_sdpo_pd_deon_tft_200_seed1/global_step_200


env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7", "--game-design", "hist"]
