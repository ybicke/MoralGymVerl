# Multi-round PGG of qwen3_8b_sdpo_pdshch_deon_tft_200_seed1 (SDPO,
# deontological principle only, trained on mixed PD, Stag Hunt and Chicken)
# at step 200, to compare with the PD-only SDPO seeds in
# multi_round_sdpo_seed2.yaml. Protocol as in multi_round.yaml (5 live
# rounds, three co-player groups, no moral text).
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_sdpo_pdshch_seed1.yaml --dry-run

num_episodes: 20           # per co-player group; x3 x5 rounds = 300 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - qwen3_8b_sdpo_pdshch_deon_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7"]
