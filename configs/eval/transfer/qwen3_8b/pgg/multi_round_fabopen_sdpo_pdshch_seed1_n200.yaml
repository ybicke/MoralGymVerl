# Live play in the public-goods game for the mixed-game SDPO run (Prisoner's
# Dilemma + Stag Hunt + Chicken, seed 1, step 200), fabricated opening, 200 episodes
# per co-player group. Same protocol as multi_round_fabopen_n200, which holds its
# references: base, the prompted model's twin group, and the PD-only seed 1.
#
#   ~/venvs/moralgym/bin/python scripts/slurm/fir/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_fabopen_sdpo_pdshch_seed1_n200.yaml --no-pack --dry-run

num_episodes: 200          # per co-player group; x3 x5 rounds = 3000 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - qwen3_8b_sdpo_pdshch_deon_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7", "--game-design", "hist"]
