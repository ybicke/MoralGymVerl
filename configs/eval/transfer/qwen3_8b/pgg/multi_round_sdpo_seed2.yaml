# Multi-round PGG of the seeded SDPO deon runs: seed 1 and seed 2 at step
# 200, and seed 2 at step 300, where the training rollouts show more
# cooperation with defectors. Protocol as in multi_round.yaml (5 live
# rounds, three co-player groups, no moral text).
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_sdpo_seed2.yaml --dry-run

num_episodes: 20           # per co-player group; x3 x5 rounds = 300 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - qwen3_8b_sdpo_pd_deon_tft_200_seed1/global_step_200
    - qwen3_8b_sdpo_pd_deon_tft_300_seed2/global_step_200
    - qwen3_8b_sdpo_pd_deon_tft_300_seed2/global_step_300

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7"]
