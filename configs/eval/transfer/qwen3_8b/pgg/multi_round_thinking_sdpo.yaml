# Thinking-mode live play of the three SDPO seeds at step 200, no
# principle in context: the multi-round twin of single_round_thinking_sdpo
# and _sdpo_seeds. Protocol as in multi_round.yaml, thinking on.
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_thinking_sdpo.yaml --dry-run

num_episodes: 20           # per co-player group; x3 x5 rounds = 300 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - qwen3_8b_sdpo_pd_deon_tft_200_seed1/global_step_200
    - qwen3_8b_sdpo_pd_deon_tft_300_seed2/global_step_200
    - qwen3_8b_sdpo_pd_deon_tft_200_seed3/global_step_200

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7", "--enable-thinking", "true",
             "--max-new-tokens", "30000"]
