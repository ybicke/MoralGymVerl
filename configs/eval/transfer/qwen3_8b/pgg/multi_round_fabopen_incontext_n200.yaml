# Prompted reference of multi_round_fabopen_n200 (see there): the untrained
# Qwen3-8B with the deontological principle in its prompt, same protocol
# and episode count.
#
#   ~/venvs/moralgym/bin/python scripts/slurm/fir/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_fabopen_n200.yaml --no-pack --dry-run
#   ~/venvs/moralgym/bin/python scripts/slurm/fir/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/multi_round_fabopen_incontext_n200.yaml --no-pack --dry-run

num_episodes: 200          # per co-player group; x3 x5 rounds = 3000 decisions/cell

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [deontological]
  protocol: [multi_round]
  checkpoint: [base]

env:
  RUN_PROBES: "off"
  GAME_DESCRIPTION: "off"
extra_args: ["--temperature", "0.7", "--game-design", "hist"]
