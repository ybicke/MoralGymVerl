# Thinking-mode smoke: one single-round PGG decision per cell with Qwen3's
# thinking switched on and a 32k token cap, to measure how long the
# thinking runs before planning a pilot. Base and SDPO seed 1 at step 200,
# each with and without the principle in context. One episode = the first
# fabricated state (own previous move C, no other contributor).
#
#   SBATCH_PARTITION=debug SBATCH_TIMELIMIT=00:30:00 EVAL_STAGE=eval \
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/single_round_thinking_smoke.yaml --dry-run

num_episodes: 1

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none, deontological]
  protocol: [single_round]
  checkpoint:
    - base
    - qwen3_8b_sdpo_pd_deon_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7", "--enable-thinking", "true",
             "--max-new-tokens", "32768"]
