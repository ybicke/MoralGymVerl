# Single-round PGG with Qwen3's thinking switched on: SDPO seed 1 at step 200,
# trained with thinking off, no principle in context. Thinking-off row: 58%
# (single_round_sdpo_seed1).
#
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/eval/transfer/qwen3_8b/pgg/single_round_thinking_sdpo.yaml --dry-run

num_episodes: 200          # 25 per fabricated (own_prev, k) state

axes:
  game: [public_goods]
  representation: [decision_full]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - qwen3_8b_sdpo_pd_deon_tft_200_seed1/global_step_200

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7", "--backend", "vllm",
             "--enable-thinking", "true", "--max-new-tokens", "30000"]
