# =============================================================================
# GRPO deon-reward arm v2 — the two-knob response to run 1's flat
# cooperation (grpo_deon_qwen_200: coop 5-9% through step ~50, KL-to-base
# 0.003, clipfrac 0.0 — policy essentially stationary):
#   1. ROOT CAUSE (dataset grpo_deon_pd_tft): TFT opponent -> deterministic
#      reward -> pure groups fall silent instead of injecting full-scale
#      advantage noise. Prompts stay byte-identical to run 1 and the SDPO
#      arms.
#   2. OPTIMIZER: back to the NeMo-RL-validated GRPO setting for this exact
#      reward structure (abl4: lr 2.5e-5, long warmup). This departs from
#      the SDPO-matched 1e-5/10 — logged as a deliberate axis: run 1 showed
#      1e-5 moves the policy too little to test the reward channel at all.
#      Warmup 50 absolute (NeMo-RL used 50/70; its purpose is preventing
#      early entropy collapse at full lr — watch actor/entropy in the first
#      ~60 steps; run 1 sat at ~0.25).
# Everything else inherits from grpo_deon_pd_qwen3 (KL 0.04, vanilla loss,
# 2048 response, thinking off, 200 steps, slim ckpts, trace dumps).
#
# Submit:
#   DATASET_CONFIG=grpo_deon_pd_tft TIME=06:00:00 bash scripts/slurm/train_verl.sh \
#       grpo_deon_pd_qwen3_v2 <run_name>
# =============================================================================
defaults:
  - grpo_deon_pd_qwen3
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 2.5e-5
      lr_warmup_steps: 50
