# =============================================================================
# SDPO: Prisoner's Dilemma vs Tit-for-Tat, Game + Deontological reward
# Extends grpo_pd_tft.yaml with self-distillation from cooperative trajectories.
#
# Key SDPO additions:
#   - loss_mode: sdpo           — enables self-distillation loss
#   - success_reward_threshold  — normalized reward > 0.8 ≈ mutual cooperation
#   - alpha: 0.5                — Jensen-Shannon divergence (symmetric KL)
#   - include_environment_feedback — moral critique string from reward_fn.py
#   - teacher_regularization: ema — stable teacher via exponential moving average
# =============================================================================
defaults:
  - ppo_trainer         # verl base — found in SDPO/verl/trainer/config/
  - moralgym_user       # Clariden paths — found in MoralGymVerl/configs/verl/
  - _self_

# Must cover the initial prompt (real size ~400-500 tok; max_prompt_length
# 2048 is the hard cap) + max_response_length (4096); feeds
# ppo_max_token_len_per_gpu and vLLM max_num_batched_tokens. 5120 fits
# Gemma-2's 8192 window with margin. VERIFY memory at first training run:
# ppo_max_token_len_per_gpu grows with this. (Was 2560 for the 32-token
# single-turn parity runs.)
max_model_len: 6144

actor_rollout_ref:
  # verl key location: actor_rollout_ref.model.* (hf_model.yaml), not actor.peft.*
  model:
    lora_rank: 32
    lora_alpha: 64
    target_modules: all-linear   # HFModelConfig requires str; all-linear = the 7 projection layers
  actor:
    optim:
      lr: 5.0e-6
      lr_warmup_steps: 50    # aligned with NeMo-RL LinearLR (same fix as grpo_pd_tft)
    ppo_mini_batch_size: 8   # 2 updates/step à 128 samples (same fix as grpo_pd_tft)
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      # Distillation settings — pinned to the NeMo-RL Phase 1 intersection
      # for the cross-stack comparison: full-logit only (no top-k), no
      # environment feedback. Restore topk/feedback after the comparison.
      full_logit_distillation: true
      alpha: 0.5                         # JSD (symmetric KL); use 0.1–0.3 for weaker models
      distillation_topk: null            # cross-stack parity: NeMo-RL Phase 1 is full-logit only
      distillation_add_tail: true
      is_clip: 2.0

      # Teacher regularization
      teacher_regularization: ema
      teacher_update_rate: 0.01          # slow EMA → stable teacher

      # What counts as a successful (cooperative) trajectory for the teacher
      # Normalized reward: R_game_norm + lambda * R_deon, scaled.
      # 0.8 corresponds roughly to mutual cooperation (R=3) with deon bonus.
      success_reward_threshold: 0.8

      # Cross-stack parity: NeMo-RL Phase 1 has no feedback synthesis.
      include_environment_feedback: false
      environment_feedback_only_without_solution: true

      # Whether to use one sample's own successful response as its demonstration
      # (true = don't; avoids trivial self-copying)
      dont_reprompt_on_self_success: true

      # Token budget for teacher reprompt (prompt + solution + feedback)
      max_reprompt_len: 4096
      reprompt_truncation: right

      # Teacher prompt templates
      # {prompt}   = original game prompt
      # {solution} = filled by solution_template if a cooperative trajectory exists
      # {feedback} = filled by feedback_template using the moral critique string
      # Closer kept content-free: the moral steer must live ONLY in the
      # {feedback} slot (moral_values.py), so teacher-signal effects are
      # attributable to the wording under test — not to a fixed nudge
      # shared by every condition. (Was: "Recall the goal: sustain mutual
      # cooperation when possible."; changed 2026-07-13 for Session 1.)
      # {feedback} after {prompt}: the model reads game -> question ->
      # principle -> "Now make your decision." — the principle directly
      # precedes the decision moment (recency-favored). Mid-prompt
      # insertion (between description and question) is NOT expressible:
      # the SDPO trainer formats the student prompt as an opaque block.
      # Top-vs-end position is an ablatable axis (both config-only).
      reprompt_template: |
        {prompt}
        {solution}
        {feedback}
        Now make your decision.
      solution_template: |

        A cooperative trajectory from this situation:
        {successful_previous_attempt}

      feedback_template: |

        Feedback on your previous attempt:
        {feedback_raw}

  rollout:
    n: 16                    # group size — matches grpo_pd_tft and NeMo-RL G=16
    temperature: 0.7
    top_p: 1.0
    # rollout.response_length interpolates from data.max_response_length below

data:
  train_batch_size: 16
  # Session-2 sizing (reasoning + multi-turn): ONE pool shared across ALL
  # rounds, and it counts BOTH assistant traces AND injected env messages
  # (tool_agent_loop.py appends user-turn tokens to response_mask as 0s;
  # termination check :248 uses len(response_mask)). Each env message is a
  # FULL game prompt ≈ 350 tok, not "~64 overhead": worst case 5 traces x
  # 512 + 4 env msgs x 350 ≈ 3960 -> 4096. The old value 32 was NeMo-RL
  # single-turn parity (cross-stack comparison, PASSED 2026-07-10) —
  # restore 32 if that comparison is ever rerun.
  max_response_length: 5120

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  # rollout_correction dropped for NeMo-RL parity (same fix as grpo_pd_tft)

trainer:
  total_epochs: 30
  val_before_train: false
  test_freq: 5
  save_freq: 10
