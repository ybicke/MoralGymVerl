# =============================================================================
# Clariden cluster paths — override before running.
# Referenced by grpo_pd_tft.yaml and sdpo_pd_tft.yaml via `defaults: - user`.
# =============================================================================
defaults:
  - _self_

vars:
  moralgym_dir: /users/${oc.env:USER}/MoralGymVerl
  sdpo_dir: /users/${oc.env:USER}/SDPO
  log_dir: /users/${oc.env:USER}/output/MoralGymVerl
  # Set by train_verl.sh: per-run dataset generated at submit time on SCRATCH.
  # For manual runs: export MORALGYM_DATASET_DIR=<dir with train/val.parquet>.
  dataset_dir: ${oc.env:MORALGYM_DATASET_DIR}
  ckpt_dir: /capstor/scratch/cscs/${oc.env:USER}/moralgym_verl_runs

data:
  train_files: ["${vars.dataset_dir}/train.parquet"]
  val_files: ["${vars.dataset_dir}/val.parquet"]
  filter_overlong_prompts: true
  # ── Token budget (two knobs, easy to confuse) ─────────────────────────────
  # 1. OUTPUT BUDGET — max_response_length (≙ NeMo-RL max_new_tokens) caps
  #    what the model may generate. In multi-turn this is ONE pool shared
  #    across ALL rounds (assistant turns + injected env messages); when
  #    exhausted the episode terminates early. There is no per-turn cap.
  #    Sizing rule: num_rounds × (per-turn reasoning + ~64 env overhead).
  # 2. ENGINE CAPACITY — vLLM pre-sizes its KV cache for the model's full
  #    context window (Gemma-2: 8192); verl overwrites rollout.max_model_len
  #    with it (vllm_async_server.py:205), so it is NOT controllable here.
  #    Costs ~2.4GB reserved KV per engine; does NOT lengthen generation.
  # Hard ceiling: prompt + all output ≤ model context window (8192 for
  # Gemma-2 — a model property, not a framework one; longer context means a
  # longer-context family like Qwen2.5 32k / Llama-3.1 128k, not more params).
  max_prompt_length: 2048
  # Short response: one action token (± chain-of-thought if reasoning=true)
  max_response_length: 512
  shuffle: true
  trust_remote_code: true

actor_rollout_ref:
  model:
    path: google/gemma-2-9b-it
    trust_remote_code: true
    # Stock Gemma-2 template hard-raises on non-alternating roles, but verl's
    # AgentLoopBase probes the tokenizer with two consecutive user messages
    # (initialize_system_prompt) — so every agent loop crashes at init. This
    # is the stock template minus only that raise; it renders byte-identically
    # for every legal conversation (verified 2026-07-05).
    custom_chat_template: "{{ bos_token }}{% if messages[0]['role'] == 'system' %}{{ raise_exception('System role not supported') }}{% endif %}{% for message in messages %}{% if (message['role'] == 'assistant') %}{% set role = 'model' %}{% else %}{% set role = message['role'] %}{% endif %}{{ '<start_of_turn>' + role + '\n' + message['content'] | trim + '<end_of_turn>\n' }}{% endfor %}{% if add_generation_prompt %}{{'<start_of_turn>model\n'}}{% endif %}"
  actor:
    ppo_micro_batch_size_per_gpu: 4
    ppo_max_token_len_per_gpu: ${max_model_len}
    use_kl_loss: false
    fsdp_config:
      # 9B model colocated with vLLM (0.5 GPU util) OOMs without offload.
      # Cheap on GH200: CPU<->GPU over NVLink-C2C.
      param_offload: true
      optimizer_offload: true
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      param_offload: true
  rollout:
    name: vllm
    # verl default TP=2 makes engines span GPU pairs and OOM at wake_up;
    # 9B fits on a single GH200, so run 4 independent TP=1 replicas.
    tensor_model_parallel_size: 1
    # vllm_async_server.py:205 overwrites max_model_len with the model's
    # max_position_embeddings (8192 for Gemma-2), so the engine's KV check
    # needs >=2.38GiB: 0.3 leaves only 1.68GiB and fails at init; 0.4 leaves
    # ~11GiB. (Do NOT combine sleep mode with
    # PYTORCH_CUDA_ALLOC_CONF=expandable_segments — vLLM memory pool asserts)
    gpu_memory_utilization: 0.4
    # First weight sync gathers the FULL base model per rank unless layered;
    # layer-by-layer summon avoids the 18.5GB spike at wake_up. Requires the
    # base model preloaded in vLLM (default load_format=dummy raises).
    layered_summon: true
    load_format: safetensors
    log_prob_micro_batch_size_per_gpu: 4
    max_num_batched_tokens: ${max_model_len}
    # NOTE: ignored by the vLLM engine (overwritten with the model's context
    # window, see token-budget note in data:) but still used by verl's
    # trainer-side length checks, so keep it consistent.
    max_model_len: ${max_model_len}
    val_kwargs:
      top_p: 0.95
      temperature: 0.7
      n: 4
      do_sample: true

algorithm:
  use_kl_in_reward: false

# ppo_trainer defaults to the experimental reward loop (dp_reward_loop:
# use_reward_loop: True). SDPO's runs use the legacy naive reward manager,
# so disable it — the legacy manager calls custom_reward_function directly.
reward_model:
  use_reward_loop: false

# verl reward manager: use custom moralgym reward function
custom_reward_function:
  path: ${vars.moralgym_dir}/src/moralgym_verl/training/reward_fn.py
  name: compute_score

trainer:
  project_name: MoralGymVerl-${oc.env:USER}
  group_name: ${oc.env:MORALGYM_GROUP,default}
  experiment_name: ${oc.env:MORALGYM_RUN_NAME,unnamed}
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 10
  test_freq: 5
  max_actor_ckpt_to_keep: 3
  total_epochs: 30
  default_local_dir: ${vars.ckpt_dir}/${trainer.experiment_name}
