# =============================================================================
# GRPO multi-turn: 5-round Prisoner's Dilemma vs Tit-for-Tat
# Rollouts run through verl's async agent loop (ToolAgentLoop) with
# GameInteraction driving the rounds; rewards summed per-episode by
# MoralGymRewardManager (turn_scores).
#
# SDPO multi-turn: copy this config, add loss_mode: sdpo + self_distillation
# block from sdpo_pd_tft.yaml, and SCALE success_reward_threshold with the
# number of rounds (episode reward is a sum, not a single-round value).
# =============================================================================
defaults:
  - ppo_trainer         # verl base — found in SDPO/verl/trainer/config/
  - moralgym_user       # Clariden paths — found in MoralGymVerl/configs/verl/
  - _self_

# Episode transcript: 5 rounds ≈ 4 injected next-round prompts + 5 actions
max_model_len: 4096

# Game/reward settings live in configs/datasets/grpo_pd_tft_mt.yaml
# (read by dataset.py at dataset-generation time, not by verl).

actor_rollout_ref:
  model:
    lora_rank: 32
    lora_alpha: 64
    target_modules: all-linear   # HFModelConfig requires str; all-linear = the 7 projection layers
  actor:
    optim:
      lr: 5.0e-6
      lr_warmup_steps: 10
    ppo_mini_batch_size: 16
    policy_loss:
      loss_mode: vanilla
  rollout:
    n: 8
    temperature: 0.7
    top_p: 1.0
    agent:
      default_agent_loop: tool_agent
    multi_turn:
      enable: true
      max_user_turns: 6        # >= num_rounds (env turns incl. parse-fail reprompts)
      max_assistant_turns: 6
      interaction_config_path: ${vars.moralgym_dir}/configs/verl/interaction_config/moralgym_interaction_config.yaml

data:
  train_batch_size: 16
  return_raw_chat: true        # agent loop + SDPO teacher reprompting need raw messages
  # ONE pool shared across ALL rounds — no per-turn cap; episode terminates
  # early when exhausted. Size as num_rounds × (per-turn output + ~64 env
  # overhead); see token-budget note in moralgym_user.yaml.
  max_response_length: 2048

# Sum turn_scores from GameInteraction instead of parsing the transcript
reward_manager:
  source: importlib
  name: MoralGymRewardManager
  module:
    path: ${vars.moralgym_dir}/src/moralgym_verl/training/reward_manager.py

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

trainer:
  total_epochs: 30
  val_before_train: false
  test_freq: 5
  save_freq: 10
