# =============================================================================
# SDPO run 2 — gemma-2-9b-it. Same run-2 axis as sdpo_run2_pd_qwen3
# (200 steps, lr 1e-5); see that file for the rationale.
#
# SUBMIT ONLY after qwen_run2_200's first ~30-50 steps confirm lr 1e-5 is
# stable (grad_norm smooth, parse_fail ~0, val trio moving) — gemma is the
# noisier substrate and the lr is the one untested knob.
#
# Submit:
#   DATASET_CONFIG=sdpo_run1_pd TIME=06:00:00 bash scripts/slurm/train_verl.sh \
#       sdpo_run2_pd_gemma gemma_run2_200
# =============================================================================
defaults:
  - sdpo_run1_pd_gemma
  - _self_

actor_rollout_ref:
  actor:
    optim:
      lr: 1.0e-5

trainer:
  total_training_steps: 200
