# PGG transfer — do the PD-trained checkpoints generalize to a game they
# never played?
#
# The training signal (SDPO teacher wording, or the GRPO deon reward) was
# applied ONLY in single-round 2-player prisoner's dilemma. This block
# evaluates those same checkpoints on the 4-player binary public-goods
# game under the PGG screen's own protocol, with NO moral text in the
# prompt -- so any cooperation is carried by the weights, into a game
# structure the policy has not seen.
#
# It reproduces Table P1's three-row logic in the commons:
#
#   base, no context            = pgg_single_turn_qwen3-8b / none
#                                 (job 3163306; 2.2% contribute, flat k)
#   trained @ step N, no text   = THIS SWEEP
#   base + principle in context = pgg_single_turn_qwen3-8b /
#                                 deontological+repair+generosity
#                                 (job 3163307; 44.8% pooled, k-slope 13.1,
#                                  k=0..3 -> 31/33/44/71)
#
# Read the same way: if a trained row lands on the in-context row without
# the text, the norm generalized; if it lands on the base row, what was
# installed was PD-specific. Headline is the k-slope within own_prev (the
# N-player analogue of D_opp), never pooled P(C).
#
# Protocol is byte-identical to the untrained screen -- same eval config,
# same 400 episodes (50 per fabricated (own_prev, k) state over 8 states),
# fixed presentation, GAME_DESCRIPTION off, T=0.7 -- so the new rows drop
# straight into the screen's table. Do not change these without re-running
# the reference cells.
#
# Checkpoint choice (4 cells = one packed node):
#   sdpo s120  the balanced checkpoint; the only PD row inside the
#              CC>=90/CD<=40/DC>=85/DD 30-60 spec
#   sdpo s200  the generous endpoint; commons-friendly on paper, and the
#              open question from the PD analysis (s120 vs s200)
#   sdpo s60   vocabulary is already present here (68% of traces) while PD
#              behaviour is NOT yet consolidated (pooled 32%). If transfer
#              shows up at s60 it rides on the acquired language; if it
#              only appears later it rides on the behaviour.
#   grpo s180  the reward channel at its optimum -- expected to transfer as
#              a steep k-slope with a low intercept (no forgiveness in the
#              reward), against SDPO's higher intercept.
#
# Submit:
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/ckpt_pgg_transfer_qwen3.yaml --dry-run
#
# 4 cells, 1 node, ~3.7 h/cell inside the 5 h pack wall.
name: ckpt_pgg_transfer_qwen3
eval_group: qwen3-8b-pgg-transfer
results_dir: post_training
config: configs/eval/pgg_screen_qwen3_8b.yaml

num_episodes: 400          # 50 decisions per fabricated (own_prev, k) state

axes:
  game: [public_goods]
  representation: [prose]
  moral_value: [none]      # NO moral text: the transfer must come from the weights
  protocol: [single_round]
  checkpoint:
    - qwen_run2_200/global_step_60
    - qwen_run2_200/global_step_120
    - qwen_run2_200/global_step_200
    - grpo_deon_tft_200/global_step_180

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"    # matched to the untrained screen

extra_args: ["--temperature", "0.7"]
