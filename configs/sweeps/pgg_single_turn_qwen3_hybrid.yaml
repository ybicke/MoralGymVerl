# PGG single-turn screen v3 — Qwen3-8B, "decision_full" dilemma block:
# the agent-centric k-table of "decision" with EVERY other player's points
# stated inside each cell. Closes both comprehension channels the v2 screen
# split between "list" (self-count into the group total: 35/50 base
# contributions were miscounts) and "decision" (others' points frozen at the
# history's values: utilitarian 4|5 was an arithmetic artifact).
#
# Smoke 2026-08-25 (job 3184844, 64 eps/cell, description off): 0 parse
# failures, 0 self-count errors, 0 frozen-others reads, 0 wrong own-payoff
# reads (every regex flag hand-checked = row-condition phrasing). Rates:
# none 1/64; utilitarian 60/64 flat (correct 50-vs-40 sums at k=0);
# deontological own=C 2,5,4,8 / own=D 0,1,1,7 of 8 (k-slope intact).
# Label inversion persists (deon reads the contribute label as the exploit)
# -- a property of the wording at n > 2, reported as a metric, not fixed.
# Protocol/budget otherwise identical to pgg_single_turn_qwen3.yaml.
# 1 x 1 x 4 x 1 = 4 cells (1 packed node). deon+repair+generosity dropped:
# riders inert single-shot (0/400 citations, tracks plain deon in v2).
#
# Submit:
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/pgg_single_turn_qwen3_hybrid.yaml --dry-run
name: pgg_single_turn_qwen3_hybrid
eval_group: pgg_single_turn_qwen3-8b_v3
config: configs/eval/pgg_screen_qwen3_8b.yaml

num_episodes: 400

axes:
  game: [public_goods]

  representation: [decision_full]

  moral_value:
    - none
    - deontological
    - universalization
    - utilitarian

  protocol: [single_round]

env:
  RUN_PROBES: "off"            # probes are P2 (PROBE_STATES generalization)
  RUN_PROBE_B_EPISODE: "off"
  GAME_DESCRIPTION: "off"

extra_args: ["--temperature", "0.7"]
