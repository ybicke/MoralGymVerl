# Checkpoint eval, qwen_run2_200 — multi-round dynamics (none arm).
# 5-round conversations vs tit_for_tat / noisy_tft / always_defect /
# always_cooperate (the eval yaml's opponent set): does the single-round
# profile transfer to dynamics — spiral recovery, sucker rate vs a
# defector, drift vs a saint? Read with scripts/analysis/recovery_rate.py.
# num_episodes is PER OPPONENT: 50 x 4 x 5 rounds = 1,000 generations/cell.
#
# Submit:
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/ckpt_qwen_run2_multi.yaml --dry-run
#
# 3 cells.
name: ckpt_qwen_run2_multi
eval_group: ckpt_qwen_run2_200_multi

config: configs/eval/teacher_signal_qwen3_8b.yaml

num_episodes: 50

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none]
  protocol: [multi_round]
  checkpoint:
    - base
    - qwen_run2_200/global_step_100
    - qwen_run2_200/global_step_200

env:
  RUN_PROBES: "off"

extra_args: ["--temperature", "0.7"]
