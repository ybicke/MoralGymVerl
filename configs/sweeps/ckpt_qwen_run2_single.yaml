# Checkpoint eval, qwen_run2_200 — single-round state profile (none arm).
# Trained adapters vs base, same seed/code/presentation: the per-state
# P(C|state) table the training rollouts only approximated (training
# states are surface-randomized, this is the screen's fixed-presentation
# prose read). Step 100 = predicted balanced-profile band, step 200 =
# endpoint (over-cooperation drift: CD past the <=40 exploitability bound).
# No probes: the none arm has nothing to contrast, and the teacher-context
# arm is a separate sweep.
#
# Submit (checkpoints live on iopsstor — the eval container does not
# mount /capstor/store):
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/ckpt_qwen_run2_single.yaml --dry-run
#
# 1 x 1 x 1 x 1 x 3 = 3 cells.
name: ckpt_qwen_run2_single
eval_group: ckpt_qwen_run2_200_single
config: configs/eval/teacher_signal_qwen3_8b.yaml

num_episodes: 400          # 100 decisions per fabricated state

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - base
    - qwen_run2_200/global_step_100
    - qwen_run2_200/global_step_200

env:
  RUN_PROBES: "off"

extra_args: ["--temperature", "0.7"]
