# Single-turn phase — template sweep.
#
# The `protocol: [single_round]` axis is what makes this phase-clean: the
# preset pins num_rounds=1, game_design=hist and opponents=[random] at submit
# time, overriding whatever the eval yaml says (teacher_signal_9b.yaml is a
# 5-round config). Nothing multi-round can enter a cell of this sweep:
#   - behavioral runs one fabricated-history decision per episode, balanced
#     over the four memory-1 states;
#   - probe A and probe B --states fabricated are single-decision instruments
#     anyway (fixed presentation, PROBE_STATES) and run in every cell;
#   - probe B --states episode needs RUN_PROBE_B_EPISODE=on, which is off by
#     default — leave it off for this phase.
#
# Submit:
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/single_turn.yaml --dry-run
#
# Results land in eval_results/teacher_signal/single_turn/, one dir per cell,
# plus sweep_manifest.json recording exactly what was launched.
name: single_turn
eval_group: single_turn
num_episodes: 200

axes:
  game: [prisoners_dilemma]
  # 'none' is the baseline anchor (no teacher context); probes skip it.
  moral_value: [none, deontological, deontological_v2, exploit_resistance]
  protocol: [single_round]

env:
  RUN_PROBES: "on"
  # Explicit rather than relying on the launcher default: this phase does not
  # run the multi-round decay probe.
  RUN_PROBE_B_EPISODE: "off"

# Add a second comparison axis by listing more values, e.g.
#   representation: [matrix, prose, list]   -> payoff-block robustness
#   restate_rules: [false, true]            -> multi-round only, NOT here
# Presentation-robustness cells go through the eval_* axes instead:
#   eval_labels / eval_layout / eval_label_order / eval_role / eval_payoffs
