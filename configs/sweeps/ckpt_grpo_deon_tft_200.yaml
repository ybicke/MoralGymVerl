# Checkpoint eval, grpo_deon_tft_200 — GRPO reward-channel twin of SDPO run 2 (Qwen3-8B). Steps 60 (emerging), 120 (converged), 180 (peak repair).
# Single-round none arm, fixed prose presentation: the screen's own
# protocol, so each trained row drops into Table 1 next to the existing
# base-none and base+principle rows of the same model. Behavioral only:
# the none arm never runs probes (signal extractability is the wrong
# question for a trained model); RUN_PROBES=off restates that.
#
# Submit (adapters on iopsstor — the eval container does not mount
# /capstor/store). Results: eval_results/post_training/<run>/.
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/ckpt_grpo_deon_tft_200.yaml --dry-run
#
# 3 cells, 1 node.
name: ckpt_grpo_deon_tft_200
eval_group: grpo_deon_tft_200
results_dir: post_training   # eval_results/post_training/<run>, apart from the pre-training screens
config: configs/eval/teacher_signal_qwen3_8b.yaml

num_episodes: 400          # 100 decisions per fabricated state

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - grpo_deon_tft_200/global_step_60
    - grpo_deon_tft_200/global_step_120
    - grpo_deon_tft_200/global_step_180

env:
  RUN_PROBES: "off"

extra_args: ["--temperature", "0.7"]
