# Checkpoint eval, qwen_run2_200 — four steps bracketing the selected
# checkpoint (90 = balanced-profile point of the state-resolved
# trajectory; 60 emerging, 120 past it, 200 the over-cooperation
# endpoint), single-round none arm, fixed prose presentation: the
# screen's own protocol, so each row drops into Table 1 next to the
# existing base-none (12|0|2|4) and base+principle (99|33|94|40) rows.
# Four cells = one packed node (billed the same as one cell).
# No probes (nothing to contrast without teacher text).
#
# Submit (adapter lives on iopsstor — the eval container does not mount
# /capstor/store). Results: eval_results/post_training/<run>/.
#   EVAL_STAGE=eval /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/ckpt_qwen_run2_single.yaml --dry-run
#
# 4 cells, 1 node.
name: ckpt_qwen_run2_200
eval_group: qwen_run2_200
results_dir: post_training   # eval_results/post_training/<run>, apart from the pre-training screens
config: configs/eval/teacher_signal_qwen3_8b.yaml

num_episodes: 400          # 100 decisions per fabricated state

axes:
  game: [prisoners_dilemma]
  representation: [prose]
  moral_value: [none]
  protocol: [single_round]
  checkpoint:
    - qwen_run2_200/global_step_60
    - qwen_run2_200/global_step_90
    - qwen_run2_200/global_step_120
    - qwen_run2_200/global_step_200

env:
  RUN_PROBES: "off"

extra_args: ["--temperature", "0.7"]
