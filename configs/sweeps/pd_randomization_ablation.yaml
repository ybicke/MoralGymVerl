# PD randomization ablation: randomize one surface axis at a time, freeze
# the rest, to see which axis the model actually reads.
#
# fixed_representation and surface_randomization are the endpoints and are
# reused from pd_presentation_robustness (same episodes, seed, config) —
# pass both group dirs to the analysis.
#
# payoffs is a content axis, not a surface one: it resamples T,R,P,S
# preserving the game's ordering, so behaviour is expected to move.
#
# Behavioral-only (probes force fixed presentation). 20 cells, 5 packed
# jobs, ~1h each.
#
# Submit:
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/pd_randomization_ablation.yaml --dry-run
name: pd_randomization_ablation
eval_group: pd_randomization_ablation
num_episodes: 400

axes:
  game: [prisoners_dilemma]
  representation: [matrix, prose]
  moral_value: [none, deontological]
  protocol: [single_round]
  presentation: [labels, layout, label_order, role, payoffs]

env:
  RUN_PROBES: "off"
  RUN_PROBE_B_EPISODE: "off"

extra_args: ["--temperature", "0.7"]
