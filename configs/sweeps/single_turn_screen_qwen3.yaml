# Single-turn screen — Qwen3-8B. Paired rerun of single_turn_screen.yaml
# (gemma-2-9b-it, 2026-08-10) with the model as the only axis that moves;
# see that file for the design rationale behind the axes.
#
# Differences live in configs/eval/teacher_signal_qwen3_8b.yaml:
# enable_thinking off, and max_new_tokens 768 so the cap binds for neither
# model (gemma's 512 never bound: 6/14400 responses lacked an Action line).
#
# Submit:
#   /usr/bin/python3.11 scripts/slurm/submit_sweep.py \
#       configs/sweeps/single_turn_screen_qwen3.yaml --dry-run
name: single_turn_screen_qwen3
eval_group: single_turn_screen_qwen3
config: configs/eval/teacher_signal_qwen3_8b.yaml

num_episodes: 400

axes:
  game: [prisoners_dilemma, stag_hunt, chicken]

  representation: [matrix, prose]

  moral_value:
    - none
    - deontological
    - utilitarian
    - virtue
    - universalization
    - deontological+repair

  protocol: [single_round]

env:
  RUN_PROBES: "on"
  RUN_PROBE_B_EPISODE: "off"

extra_args: ["--temperature", "0.7"]
