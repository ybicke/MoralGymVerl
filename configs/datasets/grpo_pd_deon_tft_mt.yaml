# Dataset generation config for moralgym_verl.training.dataset
# (consumed by dataset.py, NOT by verl/Hydra).
# Mirrors the best working NeMo-RL config: t2_hist_robust_v2_...bias075_9b
game:
  type: prisoners_dilemma
  payoffs: {T: 4, R: 3, P: 1, S: 0}
  num_rounds: 5          # multi-turn: 5 real rounds via GameInteraction
  sample_payoffs: false

opponent:
  types: [tit_for_tat]
  distribution: [1.0]

reward:
  game_reward: normalized
  intrinsic: deontological
  lambda: 3.0
  illegal_penalty: -6

prompt:
  game_design: hist
  hist_coop_bias: 0.75
  randomize_labels: true
  randomize_layout: true
  randomize_label_order: true
  randomize_role: true
  # Rounds >= 2 env messages (conversation rollout): false (default) =
  # outcome + answer-format line only; true = additionally re-insert the
  # payoff block + question (rules-retention ablation for weaker models).
  restate_rules_per_round: false
