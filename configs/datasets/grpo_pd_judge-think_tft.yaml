# GRPO dataset, judge on the principle, variant think (row 2 of
# ~/moralgym-report/notes/judge_grpo_design.tex): the judge-reward twin of
# sdpo_pd_deon_tft. (consumed by moralgym_verl.training.dataset, NOT by
# verl/Hydra.) Score: P(yes) after the judge reasons (Qwen3 thinking).
#
# Three variants differ ONLY in the judge block (scoring, thinking):
# grpo_pd_judge-yesno_tft, grpo_pd_judge-scale_tft, grpo_pd_judge-think_tft.
# Same game, opponent, prompt design and randomization as sdpo_pd_deon_tft,
# so at one seed every arm trains on byte-identical prompts. The principle
# reaches training through a judge that reads the same text as SDPO's teacher
# and scores each rollout (training/judge.py). The judge score is the whole
# reward; the game payoff is only logged (game_score), as in the SDPO arm.
# Unparseable actions keep the illegal-action penalty, as in every arm.
game:
  type: prisoners_dilemma
  payoffs: {T: 4, R: 3, P: 1, S: 0}
  num_rounds: 1
  sample_payoffs: false

opponent:
  types: [tit_for_tat]
  distribution: [1.0]

reward:
  # Logged only (game_score): the judge replaces it in the reward.
  game_reward: normalized
  intrinsic: none
  lambda: 0.0
  illegal_penalty: -6

# Kept identical to sdpo_pd_deon_tft so the prompts and state match; GRPO
# ignores the feedback string.
teacher:
  feedback: principle
  moral_value: deontological

judge:
  # Frozen base model with the principle (scripts/slurm/alliance/judge_vllm.sh);
  # address from MORALGYM_JUDGE_URL, set by the launcher (JUDGE=1).
  model: Qwen/Qwen3-8B
  moral_value: deontological   # the same text as teacher.moral_value
  scoring: yesno
  thinking: true
  max_think_tokens: 8192
  # All 256 rollouts of a step in flight at once (default 64): the 15-step run
  # (job 27239147) used only ~55 concurrent requests and 16% of the judge's KV
  # cache, and vLLM gets faster per request with larger batches. Changes speed,
  # not scores (same requests, same sampling settings).
  max_concurrency: 256

prompt:
  game_design: hist
  hist_coop_bias: 0.5
  representation: list
  reasoning: true
  randomize_labels: false
  randomize_layout: true
  randomize_label_order: true
  randomize_role: true
