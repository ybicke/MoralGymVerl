# =============================================================================
# GRPO deon, gemma-2-9b-it, 200 steps, variant 2: the Gemma-2 row of
# qwen3_8b_grpo_pd_deon_tft_200_v2 (KL-to-reference 0.04, lr 1e-5, warmup
# 10), the GRPO twin of gemma2_9b_sdpo_pd_deon_tft_200 on the same model.
#
# Gemma-2 needs its patched chat template back (_base_grpo_pd nulls it) and
# RAY_memory_usage_threshold=0.99 + MEM=800000 on `normal` nodes, as the
# Gemma-2 SDPO runs.
#
# Smoke first:
#   PARTITION=debug TIME=00:30:00 MEM=800000 RAY_memory_usage_threshold=0.99 \
#       bash scripts/slurm/train_verl.sh gemma2_9b_grpo_pd_deon_tft_200_v2 \
#       gemma2_9b_grpo_pd_deon_tft_smoke trainer.total_training_steps=2
# Run as seed replicates:
#   SEED=1 TIME=06:00:00 MEM=800000 RAY_memory_usage_threshold=0.99 \
#       bash scripts/slurm/train_verl.sh gemma2_9b_grpo_pd_deon_tft_200_v2
# =============================================================================
defaults:
  - _base_grpo_pd
  - _self_

actor_rollout_ref:
  model:
    path: google/gemma-2-9b-it
    custom_chat_template: ${vars.gemma2_chat_template}
  actor:
    optim:
      lr: 1.0e-5
      lr_warmup_steps: 10
    use_kl_loss: true
    kl_loss_coef: 0.04

trainer:
  total_training_steps: 200
