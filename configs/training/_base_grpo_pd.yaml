# =============================================================================
# GRPO trainer — single-round PD, MODEL- and REWARD-agnostic.
#
# Sets no model.path: each model config below supplies it, so every model
# arm provably shares the same optimizer, loss, sampling and schedule and
# the model is the only variable. The reward lives in
# configs/datasets/<arm>.yaml (baked into the parquet at submit time).
#
#   grpo_pd_qwen3_8b.yaml     Qwen/Qwen3-8B          (+ enable_thinking: false)
#   grpo_pd_gemma3_12b.yaml   google/gemma-3-12b-it
#   grpo_pd_llama31_8b.yaml   meta-llama/Llama-3.1-8B-Instruct
#   gemma2_9b_grpo_pd_deon_tft_150.yaml  google/gemma-2-9b-it (restores the
#                             Gemma-2 template by reference, see below)
#
# Naming: grpo_pd_<family><major>_<params>.
#
# History: runs before 2026-08-27 used grpo_pd_qwen3.yaml (no _8b suffix) —
# the deon twin job 3138544 and the util run job 3203397. That file was
# content-identical to grpo_pd_qwen3_8b.yaml and has been retired.
#
# Run any of them against either reward:
#   DATASET_CONFIG=grpo_deon_pd_tft bash scripts/slurm/train_verl.sh \
#       grpo_pd_<model>_<params> <run_name>
#   DATASET_CONFIG=grpo_util_pd_tft ...
#
# custom_chat_template: null is LOAD-BEARING here — _base_clariden.yaml
# defaults it to a Gemma-2-specific template (that model's stock template
# hard-raises on consecutive user turns, which verl's agent loop probes
# with). Any model other than gemma-2-9b-it MUST null it or its prompts
# render through Gemma-2's template. Only override this back for gemma-2.
#
# Provenance / per-value reasoning: see grpo_deon_pd_qwen3.yaml (the frozen
# run-1 record) — vanilla loss, max_model_len 4096, 2048-token responses.
# Sampling T 1.0, rollout IS correction, warmup 10 and no KL-to-reference
# term follow the SDPO paper; lr 2.5e-5 is the NeMo-RL-validated GRPO rate.
# The runs up to 2026-09 used warmup 50, T 0.7 and KL coef 0.04.
# =============================================================================
defaults:
  - ppo_trainer         # verl base — found in SDPO/verl/trainer/config/
  - _base_clariden       # Clariden paths — found in MoralGymVerl/configs/training/
  - _self_

max_model_len: 4096

actor_rollout_ref:
  model:
    # See header — do NOT drop this for a non-gemma-2 model.
    custom_chat_template: null
    lora_rank: 32
    lora_alpha: 64
    target_modules: all-linear
  actor:
    # Slim LoRA checkpoints (lora_adapter/ is saved unconditionally); resume
    # needs base HF weights + lora_adapter_path.
    checkpoint:
      save_contents: [optimizer, extra]
    optim:
      lr: 2.5e-5
      lr_warmup_steps: 10
    # = train_batch_size: ONE gradient step per generation batch, fully on-policy.
    ppo_mini_batch_size: 16
    # No KL-to-reference term, as in the SDPO paper's GRPO baseline.
    use_kl_loss: false
    policy_loss:
      loss_mode: vanilla
  rollout:
    n: 16
    temperature: 1.0
    top_p: 1.0
    # vLLM log-probs of the sampled tokens: input to rollout_is below, and
    # logged as training/rollout_probs_diff_*.
    calculate_log_probs: true

data:
  train_batch_size: 16
  # 2048 removes the truncation->parse-fail confound (SDPO run 1 finding).
  max_response_length: 2048

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  # Per-token importance weights for the sampler-vs-trainer mismatch,
  # truncated at 2 (verl default), as in the SDPO paper's GRPO baseline.
  rollout_correction:
    rollout_is: token

trainer:
  # Slim checkpoints -> keep the full 15-point trajectory.
  max_actor_ckpt_to_keep: null
  # 150 steps = 2,400 of 8,000 samples, single pass; ckpt every 10.
  # NOTE: the deon arm's completed run (job 3138544, grpo_deon_tft_200)
  # predates this and ran 200. Compare arms at the step-150 checkpoint,
  # not at their endpoints.
  total_epochs: 1
  total_training_steps: 150
  val_before_train: false
  test_freq: 10
  save_freq: 10
  log_val_generations: 16
  rollout_data_dir: ${vars.ckpt_dir}/${trainer.experiment_name}/rollouts
