# =============================================================================
# SDPO deon on mixed PD, Stag Hunt and Chicken, Qwen3-8B, 200 steps. The
# trainer is qwen3_8b_sdpo_pd_deon_tft_200 with 36 prompts per step instead
# of 16, read in dataset order so every batch holds 12 per game (dataset
# sdpo_pdshch_deon_tft, derived from the run name).
# =============================================================================
defaults:
  - qwen3_8b_sdpo_pd_deon_tft_200
  - _self_

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 36   # = train_batch_size: one gradient step per batch

data:
  train_batch_size: 36
  shuffle: false
