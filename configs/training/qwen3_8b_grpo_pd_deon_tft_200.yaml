# =============================================================================
# GRPO deon-reward arm — Qwen3-8B. The reward-channel twin of
# qwen3_8b_sdpo_pd_deon-repair-gen_tft_200: same model, data geometry, LoRA, optimizer, sampling,
# batching, length caps, schedule, and logging; the ONLY intended
# differences are the signal channel and the loss:
#   - loss_mode vanilla (PPO-clip over GRPO group-normalized advantages)
#     instead of sdpo; no self_distillation block, so no teacher reprompt,
#     no EMA teacher, no distillation loss.
#   - moral signal = deontological intrinsic in the scalar reward
#     (dataset grpo_deon_pd: normalized game + 0.75 * deon), instead of
#     the principle text in the teacher context (dataset _base_sdpo_pd:
#     intrinsic none, feedback_mode principle).
# Everything below is copied from the _base_sdpo_pd -> _qwen3 -> run2 stack
# rather than inherited, because inheriting would drag self_distillation in.
#
# Deliberate comparability calls (each is a place the arms COULD differ):
#   - lr 1e-5 / warmup 10 = SDPO run 2's optimizer, held fixed so the
#     optimizer is not a confound. This is 2.5x below the validated
#     NeMo-RL GRPO lr (grpo_pd_tft: 2.5e-5) — if the run barely moves in
#     40 steps, that lr is the sanctioned fallback (log it as an axis).
#     Watch entropy: full-lr-early collapsed entropy in NeMo-RL (i9klhxy4).
#   - KL to reference ON (use_kl_loss true, coef 0.04): the canonical
#     GRPO loss includes beta * KL(pi || pi_ref), and 0.04 is the
#     grpo_pd_tft / NeMo-RL-validated value — decided 2026-08-21: run
#     textbook GRPO rather than strip the term to match SDPO (whose
#     anchor is the EMA teacher, not a ref-KL). Accepted asymmetry:
#     both arms are anchored, just by different mechanisms.
#   - Rollout IS correction stays OFF (matches both prior stacks) — but
#     that decision was measured at ~7-token outputs; at 2048-token
#     reasoning traces watch training/rollout_probs_diff_mean|max and
#     training/rollout_actor_probs_pearson_corr (enabled below via
#     rollout.calculate_log_probs) and revisit if diff_max spikes toward
#     1 or the pearson corr sags below ~0.99.
#   - max_model_len 4096 kept although GRPO never reprompts (~2600 would
#     do): keeps the engine/packing config identical across arms.
#
# Submit (same seed 42 default => byte-identical prompts to the SDPO runs):
#   DATASET_CONFIG=grpo_deon_pd TIME=06:00:00 bash scripts/slurm/train_verl.sh \
#       grpo_deon_pd_qwen3 <run_name>
# =============================================================================
defaults:
  - ppo_trainer         # verl base — found in SDPO/verl/trainer/config/
  - _base_clariden       # Clariden paths — found in MoralGymVerl/configs/training/
  - _self_

max_model_len: 4096

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B
    custom_chat_template: null   # stock Qwen3 template handles consecutive user turns
    lora_rank: 32
    lora_alpha: 64
    target_modules: all-linear
  actor:
    # Slim LoRA checkpoints (lora_adapter/ is saved unconditionally); same
    # resume caveat as the SDPO runs: base HF weights + lora_adapter_path.
    checkpoint:
      save_contents: [optimizer, extra]
    optim:
      # Job 3138544 (the v2 run this file records) trained at 2.5e-5 /
      # warmup 50 -- verified against the run's config dump in
      # logs_verl/training/3138544_*.log. The naming migration had
      # frozen the CANCELLED run-1 optimizer (1e-5 / 10) here by
      # mistake; corrected 2026-09-09.
      lr: 2.5e-5
      lr_warmup_steps: 50
    # = train_batch_size: ONE gradient step per generation batch, fully
    # on-policy — same as the SDPO arm.
    ppo_mini_batch_size: 16
    # Canonical GRPO KL-to-reference term in the loss (DeepSeekMath eq. 3);
    # 0.04 ≙ NeMo-RL reference_policy_kl_penalty (grpo_pd_tft-validated).
    # Overrides _base_clariden's use_kl_loss: false. With LoRA, pi_ref =
    # the frozen base model, so the ref pass is cheap.
    use_kl_loss: true
    kl_loss_coef: 0.04
    policy_loss:
      loss_mode: vanilla
  rollout:
    n: 16
    temperature: 0.7
    top_p: 1.0
    # Record vLLM's own logprobs of the sampled tokens so verl logs the
    # rollout-vs-trainer mismatch (training/rollout_probs_diff_* +
    # training/rollout_actor_probs_pearson_corr). Monitoring only — no
    # behavior change; this is the evidence for whether IS correction is
    # ever needed at 2048-token traces.
    calculate_log_probs: true

data:
  train_batch_size: 16
  # 2048 removes the truncation->parse-fail confound (SDPO run 1 finding).
  # Unlike the SDPO arm, here the reward DOES reach the gradient, but it is
  # length-independent, so this cap is still the only brake on length drift.
  max_response_length: 2048
  # Reasoning traces allowed, <think> tokens OFF — same finding as the
  # eval + SDPO configs: thinking ON blows the response budget.
  apply_chat_template_kwargs:
    enable_thinking: false

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

trainer:
  # Slim checkpoints -> keep the full 20-point trajectory.
  max_actor_ckpt_to_keep: null
  # Same schedule as SDPO run 2: 200 steps = 3,200 of 8,000 samples,
  # single pass; checkpoints every 10 for the trajectory eval.
  total_epochs: 1
  total_training_steps: 200
  val_before_train: false
  test_freq: 10
  save_freq: 10
  # Browsable traces in wandb — "does the CoT invoke the norm without the
  # principle ever being shown" is the qualitative read for this arm.
  log_val_generations: 16
  rollout_data_dir: ${vars.ckpt_dir}/${trainer.experiment_name}/rollouts
