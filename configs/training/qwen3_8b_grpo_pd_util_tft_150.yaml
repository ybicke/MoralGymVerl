# =============================================================================
# GRPO — Qwen3-8B. Everything except the model is _base_grpo_pd.
#
#   DATASET_CONFIG=grpo_deon_pd_tft bash scripts/slurm/train_verl.sh \
#       grpo_pd_qwen3_8b qwen3_deon_150
#   DATASET_CONFIG=grpo_util_pd_tft bash scripts/slurm/train_verl.sh \
#       grpo_pd_qwen3_8b qwen3_util_150
#
# The reference arm: the deon twin (job 3138544) and the util run
# (job 3203397) both ran this model. Note those two predate this file —
# they used grpo_pd_qwen3.yaml, which is identical in content and is
# retired once job 3203397 is past config load.
#
# enable_thinking: false is the one Qwen-specific knob (Qwen3's template
# accepts it; the other model configs leave apply_chat_template_kwargs
# empty). Thinking ON blows the 2048-token response budget — same finding
# as the eval and SDPO configs.
# =============================================================================
defaults:
  - _base_grpo_pd
  - _self_

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B

data:
  # Reasoning traces allowed, <think> tokens OFF.
  apply_chat_template_kwargs:
    enable_thinking: false
