# =============================================================================
# SDPO deon with random action labels, Olmo-3-7B-Think, 100 steps. The Think
# row of olmo3_7b_sdpo_pd_deon-randlabels_tft_200: same recipe (_base_sdpo_pd,
# lr 1e-5, dataset sdpo_pd_deon-randlabels_tft from the run name), with the
# loss restricted to the tokens after </think> (self_distillation.distill_after,
# ~/SDPO e663d03). The thinking conditions student and teacher but gets no
# gradient; the question is whether the principle enters it anyway.
#
# Model-specific (probe 2026-10-16, ~/hf_dl/olmo3think_probe.log):
#   - Stock template; always thinks (the generation prompt prefills <think>),
#     no thinking switch, so no apply_chat_template_kwargs.
#   - Length at T 1.0: mean 6.7k tokens, p90 11k, p99 13.7k, answer after
#     </think> ~250. 12288 keeps ~95% of samples; an unclosed sample has an
#     all-zero mask. max_model_len 16384 leaves prompt + principle headroom.
#   - rollout.n 8 and validation only at the end: ~11x the Instruct run's
#     tokens per step, sized for one 12 h job. Set total_training_steps from
#     the smoke's step time; keep test_freq equal to it.
#   - gpu_memory_utilization 0.75: Olmo-3 has no grouped KV heads (512 KB per
#     token), so the KV cache bounds how many 12k sequences decode at once.
#   - Micro-batches of 1 sequence: up to 16k tokens each.
#
# Smoke BEFORE the full run:
#   PARTITION=debug TIME=01:00:00 bash scripts/slurm/train_verl.sh \
#        olmo3think_7b_sdpo_pd_deon-randlabels_tft_100 \
#        olmo3think_7b_sdpo_pd_deon-randlabels_tft_smoke trainer.total_training_steps=2
# Full run:
#   SEED=1 DRY_RUN=1 bash scripts/slurm/train_verl.sh olmo3think_7b_sdpo_pd_deon-randlabels_tft_100
# =============================================================================
defaults:
  - _base_sdpo_pd
  - _self_

max_model_len: 16384

actor_rollout_ref:
  model:
    path: allenai/Olmo-3-7B-Think
    custom_chat_template: null
  actor:
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1.0e-5
    self_distillation:
      distill_after: "</think>"
  ref:
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    n: 8
    gpu_memory_utilization: 0.75
    log_prob_micro_batch_size_per_gpu: 1

data:
  max_response_length: 12288

trainer:
  total_training_steps: 100
  test_freq: 100
