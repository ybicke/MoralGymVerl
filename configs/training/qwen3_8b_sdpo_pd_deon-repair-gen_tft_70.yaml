# =============================================================================
# SDPO run 1 — Qwen3-8B. The shared recipe lives in _base_sdpo_pd.yaml
# (same principle, same data, same SDPO settings as gemma2_9b_sdpo_pd_deon-repair-gen_tft_70);
# the model is the only axis that moves, per the unified-recipe decision.
# Overrides:
#   - model path (no custom chat template needed: Qwen3's stock template
#     handles consecutive user turns).
#   - thinking OFF via apply_chat_template_kwargs — same finding as the
#     eval config (teacher_signal_qwen3_8b.yaml): thinking ON blows the
#     response budget (1/16 parsed at 512 tokens), OFF parses 16/16.
#
# Submit:
#   DATASET_CONFIG=_base_sdpo_pd sbatch scripts/slurm/train_verl.sh \
#       qwen3_8b_sdpo_pd_deon-repair-gen_tft_70 <run_name>
# =============================================================================
defaults:
  - _base_sdpo_pd
  - _self_

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B
    custom_chat_template: null

data:
  apply_chat_template_kwargs:
    enable_thinking: false
